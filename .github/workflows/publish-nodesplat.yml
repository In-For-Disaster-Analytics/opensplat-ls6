name: Publish NodeSplat all-in-one image

on:
  workflow_dispatch:
  push:
    branches: [main, deploy/webodm-preparation-20261028]
    paths:
      - ".github/workflows/publish-nodesplat.yml"
      - "images/Dockerfile.nodesplat"
      - "NodeSplat/**"
      - "tapisjob_app.sh"
      - "stage_project.py"
      - "validate_*.py"
      - "prepare_webodm.py"
      - "webodm_*.py"
      - "app.nodesplat.json"

permissions:
  contents: read
  packages: write

jobs:
  nodesplat:
    name: Build and publish the NodeSplat image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The CUDA "devel" base image unpacks to many GB per layer, more than the runner's free disk can hold
      # together with the new layers ("no space left on device"). Remove preinstalled toolchains this job never uses.
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/in-for-disaster-analytics/opensplat-ls6
          tags: |
            type=raw,value=nodesplat
            type=raw,value=nodesplat-${{ github.sha }}

      # Requires ghcr.io/in-for-disaster-analytics/opensplat-ls6:cuda (publish-images.yml) to exist.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile.nodesplat
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=nodesplat
          cache-to: type=gha,mode=max,scope=nodesplat
