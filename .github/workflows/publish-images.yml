name: Publish OpenSplat images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-images.yml"
      - "images/Dockerfile.cpu"
      - "images/Dockerfile.cuda"
      - "images/opensplat-pins.env"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish ${{ matrix.profile }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: cpu
            dockerfile: images/Dockerfile.cpu
            tag: cpu
          - profile: cuda
            dockerfile: images/Dockerfile.cuda
            tag: cuda

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/in-for-disaster-analytics/opensplat-ls6
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}-${{ github.sha }}

      - name: Build and push ${{ matrix.profile }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            OPENSPLAT_GIT_COMMIT=${{ vars.OPENSPLAT_GIT_COMMIT || 'effe9e5dbe6d7f672ecd7f4c59a6c1cf879d916f' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=opensplat-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=opensplat-${{ matrix.profile }}
